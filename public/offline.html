<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Offline · PayFlow</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        background: #0b0b12;
        color: #f4f4f8;
        text-align: center;
        padding: 24px;
      }
      main {
        max-width: 380px;
      }
      a {
        color: #a5b4fc;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        PayFlow could not reach the network. Attendance check-ins you make from the Attendance page
        are saved on this device and sent when you are back online.
      </p>
      <p><a href="/attendance">Open Attendance</a></p>
    </main>
  </body>
</html>
